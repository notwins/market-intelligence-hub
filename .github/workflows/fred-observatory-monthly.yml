name: Monthly FRED Observatory refresh
on:
  workflow_dispatch:
  schedule:
    # 08:00 Singapore on the first of each month; GitHub may delay a start.
    - cron: '0 0 1 * *'
permissions:
  contents: read
concurrency:
  group: market-hub-publish
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official workbook and archived-table readers
        run: python -m pip install openpyxl==3.1.5 pypdf==6.21.4
      - name: Verify overlap and revision handling
        run: |
          python -m unittest discover -s scripts -p test_refresh_fred_observatory.py
          python -m unittest discover -s scripts -p test_refresh_fred_extra_sources.py
      - name: Refresh the recent overlap and retain all older history
        run: python scripts/refresh_fred_observatory.py --work-dir "$RUNNER_TEMP/fred-refresh" --package
      - name: Reconcile all full datasets and their download bundle
        run: python -m unittest discover -s scripts -p test_fred_observatory.py
      - name: Commit only the validated data archive
        run: python scripts/commit_fred_observatory.py --work-dir "$RUNNER_TEMP/fred-refresh"
      - name: Rebuild shared derived catalogues
        run: |
          python scripts/independent_delivery_guard.py
          python scripts/build_article_palettes.py
          python scripts/build_desk_data.py
          python scripts/build_site_search.py
          python scripts/build_architecture_map.py
          python scripts/build_external_sources.py
          python scripts/build_publication_timeline.py
          python scripts/validate_research_contracts.py
      - name: Build the normal byte-preserving Pages artifact
        run: python scripts/build_pages_artifact.py --output "$RUNNER_TEMP/fred-pages"
      - name: Run the complete Pages artifact gate
        run: python scripts/validate_pages_artifact.py --artifact-root "$RUNNER_TEMP/fred-pages" --report "$RUNNER_TEMP/fred-pages-audit.json"
      - name: Publish data with a non-force main update
        run: git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fred-pages/site
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
      - name: Verify the published FRED collection
        run: python scripts/sync_fred_observatory.py --verify-only --expected-version-file "$RUNNER_TEMP/fred-refresh/refresh-report.json"
      - name: Preserve the refresh receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-monthly-refresh-receipt
          path: |
            ${{ runner.temp }}/fred-refresh/refresh-report.json
            ${{ runner.temp }}/fred-refresh/revisions.json
            ${{ runner.temp }}/fred-pages-audit.json
      - name: Flag source checks that retained previous values
        run: python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/fred-refresh/refresh-report.json')); assert not d['failed_count'], 'Partial refresh published with explicit failed-source status; previous verified values retained'"
