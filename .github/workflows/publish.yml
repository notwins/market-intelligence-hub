name: Market data, weekly Fed history and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Midnight UTC is 08:00 Asia/Singapore. GitHub may delay scheduled jobs.
    - cron: '0 0 * * *'
    # Weekly check of monthly Fed FX and benchmark yields. UTC; may be delayed.
    - cron: '17 6 * * 6'
permissions:
  contents: read
concurrency:
  group: market-hub-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      update_outcome: ${{ steps.update.outcome }}
      history_outcome: ${{ steps.history.outcome }}
      source_sha: ${{ steps.publication_revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve legacy publications and independent delivery contract
        run: python3 scripts/independent_delivery_guard.py
      - name: Test automatic publication colours
        run: node scripts/test_publication_colour.cjs
      - name: Select publication path before source restore
        id: publication_path
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f site/index.html ] && [ -f site/data/history-fed.json ]; then
            echo "fast=true" >> "$GITHUB_OUTPUT"
          else
            echo "fast=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore source bundle on first publication
        run: |
          if [ ! -f site/index.html ]; then
            unzip -oq Reuters_Market_Intelligence_Hub_Restored.zip
          fi
      - name: Test publisher validation and archive retention
        if: steps.publication_path.outputs.fast != 'true'
        run: |
          python3 scripts/build_article_palettes.py
          python3 scripts/build_desk_data.py
          python3 scripts/build_site_search.py
          python3 scripts/build_external_sources.py
          python3 scripts/validate_research_contracts.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Audit V3 source data and comparison logic
        if: steps.publication_path.outputs.fast != 'true'
        run: |
          if [ -f scripts/test_v3.cjs ]; then
            node scripts/test_v3.cjs
          fi
          node scripts/test_fed_history_ui.cjs
          node scripts/test_history_context.cjs
          node scripts/test_yield_comparisons.cjs
          node scripts/test_history_layout.cjs
          node scripts/test_v4.cjs
          node scripts/test_cpf_calculator.cjs
          node scripts/test_table_controls.cjs
          node scripts/test_ust_table.cjs
          node scripts/test_chart_controls.cjs
          node scripts/test_ust_chart_layout.cjs
          node scripts/test_scheduled_reports.cjs
          node scripts/test_policy_report_visuals.cjs
          node scripts/test_news_reading.cjs
          node scripts/test_site_search.cjs
          node scripts/test_boolean_search.cjs
          node scripts/test_search_interactions.cjs
          node scripts/test_external_sources.cjs
          node scripts/test_external_sources_interactions.cjs
          node scripts/test_research_context.cjs
          node scripts/test_research_feed.cjs
          node scripts/test_content_delivery.cjs
          node scripts/test_read_up_reader.cjs
          node scripts/test_si_pricing.cjs
          node scripts/test_bos_equity.cjs
          node scripts/test_share_prices.cjs
          node scripts/test_share_charts.cjs
          node scripts/test_share_enrichment.cjs
          node scripts/test_beta_shares.cjs
          node scripts/test_share_consumer_defaults.cjs
          node scripts/test_global_search.cjs
          node scripts/test_intel_quick_wins.cjs
          node scripts/test_ui_clutter_cleanup.cjs
          node scripts/test_section_jump.cjs
          node scripts/test_watchlist.cjs
          node scripts/test_market_snapshot.cjs
          node scripts/test_watchlist_reading.cjs
          node scripts/test_credit_issues.cjs
          node scripts/test_dashboard_readability.cjs
          node scripts/test_sidebar_scrollbar.cjs
          node scripts/test_reader_independence.cjs
          node scripts/test_colour_reference.cjs
          node scripts/test_tag_map.cjs
          node scripts/test_tag_family_tree.cjs
          node scripts/test_bond_watchlist.cjs
          node scripts/test_desk_ui.cjs
          node scripts/test_desk_release.cjs
      - name: Refresh Reuters headline metadata
        id: update
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        continue-on-error: true
        run: python3 scripts/update_news.py
      - name: Refresh weekly Fed FX and Treasury benchmark history
        id: history
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * 6' || hashFiles('site/data/history-fed.json') == ''
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/update_fed_history.py
      - name: Rebuild public site search catalogue
        run: python3 scripts/build_site_search.py
      - name: Commit new headlines, archives and update status
        if: steps.publication_path.outputs.fast != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/publish_generated_data.py
      - name: Revalidate reconciled source and rebuild deployment catalogue
        run: |
          python3 scripts/build_article_palettes.py
          python3 scripts/build_desk_data.py
          python3 scripts/build_site_search.py
          python3 scripts/build_external_sources.py
          python3 scripts/validate_research_contracts.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_v3.cjs
          node scripts/test_fed_history_ui.cjs
          node scripts/test_history_context.cjs
          node scripts/test_yield_comparisons.cjs
          node scripts/test_history_layout.cjs
          node scripts/test_v4.cjs
          node scripts/test_cpf_calculator.cjs
          node scripts/test_table_controls.cjs
          node scripts/test_ust_table.cjs
          node scripts/test_chart_controls.cjs
          node scripts/test_ust_chart_layout.cjs
          node scripts/test_scheduled_reports.cjs
          node scripts/test_policy_report_visuals.cjs
          node scripts/test_news_reading.cjs
          node scripts/test_si_pricing.cjs
          node scripts/test_bos_equity.cjs
          node scripts/test_share_prices.cjs
          node scripts/test_share_charts.cjs
          node scripts/test_share_enrichment.cjs
          node scripts/test_beta_shares.cjs
          node scripts/test_share_consumer_defaults.cjs
          node scripts/test_global_search.cjs
          node scripts/test_intel_quick_wins.cjs
          node scripts/test_ui_clutter_cleanup.cjs
          node scripts/test_section_jump.cjs
          node scripts/test_watchlist.cjs
          node scripts/test_market_snapshot.cjs
          node scripts/test_watchlist_reading.cjs
          node scripts/test_credit_issues.cjs
          node scripts/test_dashboard_readability.cjs
          node scripts/test_sidebar_scrollbar.cjs
          node scripts/test_reader_independence.cjs
          node scripts/test_colour_reference.cjs
          node scripts/test_tag_map.cjs
          node scripts/test_tag_family_tree.cjs
          node scripts/test_bond_watchlist.cjs
          python3 scripts/build_site_search.py
          node scripts/test_site_search.cjs
          node scripts/test_boolean_search.cjs
          node scripts/test_search_interactions.cjs
          node scripts/test_external_sources.cjs
          node scripts/test_external_sources_interactions.cjs
          node scripts/test_research_context.cjs
          node scripts/test_research_feed.cjs
          node scripts/test_content_delivery.cjs
          node scripts/test_read_up_reader.cjs
          node scripts/test_desk_ui.cjs
          node scripts/test_desk_release.cjs
      - name: Build public publication timeline
        run: |
          python3 scripts/build_publication_timeline.py
          node scripts/test_publication_timeline.cjs
      - name: Preserve conflicting source-data patch
        if: failure() && hashFiles('pending-publisher.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pending-publisher-patch
          path: pending-publisher.patch
      - name: Stage Pages without changing protected original bytes
        run: |
          python3 scripts/build_pages_artifact.py --output "$RUNNER_TEMP/mih-pages"
      - name: Validate final Pages artifact after all transformations
        run: |
          python3 scripts/validate_pages_artifact.py --artifact-root "$RUNNER_TEMP/mih-pages" --report "$RUNNER_TEMP/pages-integrity-audit.json"
      - name: Retain final artifact integrity audit
        uses: actions/upload-artifact@v4
        with:
          name: pages-integrity-audit
          path: ${{ runner.temp }}/pages-integrity-audit.json
      - name: Record the exact source revision for live verification
        id: publication_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mih-pages/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
      - name: Verify accepted report destinations on the public site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_research_destinations.py --base-url "$PAGES_URL"
      - name: Flag feed failure after publishing visible health status
        if: needs.build.outputs.update_outcome == 'failure' || needs.build.outputs.history_outcome == 'failure'
        run: |
          echo 'A feed failed. Previous valid data and visible failure status were published.'
          exit 1
